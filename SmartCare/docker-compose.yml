services:


  mysql:
    image: mysql:8
    container_name: smartcare-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - smartcare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: smartcare-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - smartcare-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartcare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smartcare-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


  eureka-server:
    build:
      context: ./eureka-server
    container_name: smartcare-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_REGISTER-WITH-EUREKA: "false"
      EUREKA_CLIENT_FETCH-REGISTRY: "false"
    networks:
      - smartcare-network


  api-gateway:
    build:
      context: ./api-gateway
    container_name: smartcare-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - smartcare-network

  main-service:
    build:
      context: ./main-service
    container_name: smartcare-main-service
    restart: unless-stopped
    ports:
      - "8091:8091"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcare
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartcare-network

  appointment-service:
    build:
      context: ./appointment-service
    container_name: smartcare-appointment-service
    restart: unless-stopped
    ports:
      - "8092:8092"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcare
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - smartcare-network

  medical-record-service:
    build:
      context: ./medical-record-service
    container_name: smartcare-medical-record-service
    restart: unless-stopped
    ports:
      - "8093:8093"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/smartcare_db
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - smartcare-network

  chatbot-service:
    build:
      context: ./chatbot-service
    container_name: smartcare-chatbot-service
    restart: unless-stopped
    ports:
      - "8094:8094"
    env_file: .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - smartcare-network


volumes:
  mysql-data:
  mongo-data:
  redis-data:

networks:
  smartcare-network:
    driver: bridge
