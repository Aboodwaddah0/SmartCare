spring.application.name=chatbot-service

spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.base-url=https://api.groq.com/openai

spring.ai.openai.chat.options.model=llama3-70b-8192

server.port=8094

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE:http://localhost:8761/eureka}

logging.level.root=INFO
logging.level.com.example.chatbot=DEBUG
logging.file.name=logs/chatbot-service.log